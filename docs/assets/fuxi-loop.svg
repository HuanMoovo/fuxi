<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920"><title>刻意练习闭环：定靶-练-测-诊-修</title><defs><marker id="aN" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,1 L7,4.5 L0,8" fill="none" stroke="#93A0BF" stroke-width="1.6"/></marker><marker id="aE0" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,1 L7,4.5 L0,8" fill="none" stroke="#8B5CF6" stroke-width="1.8"/></marker><marker id="aE1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,1 L7,4.5 L0,8" fill="none" stroke="#22D3EE" stroke-width="1.8"/></marker><marker id="aE2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,1 L7,4.5 L0,8" fill="none" stroke="#34D399" stroke-width="1.8"/></marker><marker id="aE3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,1 L7,4.5 L0,8" fill="none" stroke="#F59E0B" stroke-width="1.8"/></marker><marker id="aE4" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,1 L7,4.5 L0,8" fill="none" stroke="#FB7185" stroke-width="1.8"/></marker><radialGradient id="glowV" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.22"/><stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient><radialGradient id="glowC" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#22D3EE" stop-opacity="0.18"/><stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/></radialGradient><linearGradient id="lgA" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8B5CF6"/><stop offset="25%" stop-color="#22D3EE"/><stop offset="50%" stop-color="#34D399"/><stop offset="75%" stop-color="#F59E0B"/><stop offset="100%" stop-color="#FB7185"/></linearGradient></defs><rect width="1440" height="920" fill="#0B1020"/><circle cx="360" cy="480" r="360" fill="url(#glowV)"/><text x="64" y="70" font-size="40" fill="#E8ECF8" font-weight="800" text-anchor="start" dominant-baseline="middle">精练 · 刻意练习闭环</text><text x="64" y="110" font-size="19" fill="#93A0BF" font-weight="400" text-anchor="start" dominant-baseline="middle">无反馈 = 无精练：每一次循环都要闭合</text><circle cx="420" cy="260" r="66" fill="#121A2E" stroke="#8B5CF6" stroke-width="2"/><text x="420" y="250" font-size="22" fill="#E8ECF8" font-weight="700" text-anchor="middle" dominant-baseline="middle">定靶</text><text x="420" y="276" font-size="14" fill="#93A0BF" font-weight="400" text-anchor="middle" dominant-baseline="middle">选一个子技能</text><path d="M 530 285 A 250 250 0 0 1 600 336" fill="none" stroke="#8B5CF6" stroke-width="2.4" opacity="0.75" marker-end="url(#aE0)"/><circle cx="658" cy="433" r="66" fill="#121A2E" stroke="#22D3EE" stroke-width="2"/><text x="658" y="423" font-size="22" fill="#E8ECF8" font-weight="700" text-anchor="middle" dominant-baseline="middle">全神练</text><text x="658" y="449" font-size="14" fill="#93A0BF" font-weight="400" text-anchor="middle" dominant-baseline="middle">在能力边缘</text><path d="M 668 545 A 250 250 0 0 1 641 627" fill="none" stroke="#22D3EE" stroke-width="2.4" opacity="0.75" marker-end="url(#aE1)"/><circle cx="567" cy="712" r="66" fill="#121A2E" stroke="#34D399" stroke-width="2"/><text x="567" y="702" font-size="22" fill="#E8ECF8" font-weight="700" text-anchor="middle" dominant-baseline="middle">即时测</text><text x="567" y="728" font-size="14" fill="#93A0BF" font-weight="400" text-anchor="middle" dominant-baseline="middle">证据 &gt; 感觉</text><path d="M 463 756 A 250 250 0 0 1 377 756" fill="none" stroke="#34D399" stroke-width="2.4" opacity="0.75" marker-end="url(#aE2)"/><circle cx="273" cy="712" r="66" fill="#121A2E" stroke="#F59E0B" stroke-width="2"/><text x="273" y="702" font-size="22" fill="#E8ECF8" font-weight="700" text-anchor="middle" dominant-baseline="middle">诊断</text><text x="273" y="728" font-size="14" fill="#93A0BF" font-weight="400" text-anchor="middle" dominant-baseline="middle">根因分类</text><path d="M 199 627 A 250 250 0 0 1 172 545" fill="none" stroke="#F59E0B" stroke-width="2.4" opacity="0.75" marker-end="url(#aE3)"/><circle cx="182" cy="433" r="66" fill="#121A2E" stroke="#FB7185" stroke-width="2"/><text x="182" y="423" font-size="22" fill="#E8ECF8" font-weight="700" text-anchor="middle" dominant-baseline="middle">修正再练</text><text x="182" y="449" font-size="14" fill="#93A0BF" font-weight="400" text-anchor="middle" dominant-baseline="middle">针对性重练</text><path d="M 240 336 A 250 250 0 0 1 310 285" fill="none" stroke="#FB7185" stroke-width="2.4" opacity="0.75" marker-end="url(#aE4)"/><text x="420" y="510" font-size="30" fill="#E8ECF8" font-weight="800" text-anchor="middle" dominant-baseline="middle">闭环</text><text x="420" y="544" font-size="15" fill="#93A0BF" font-weight="400" text-anchor="middle" dominant-baseline="middle">缺一环 = 原地踏步</text><rect x="800" y="150" width="590" height="240" rx="18" fill="#121A2E" stroke="#232F4E" stroke-width="1.2"/><text x="824" y="184" font-size="24" fill="#E8ECF8" font-weight="700" text-anchor="start" dominant-baseline="middle">三速反馈</text><circle cx="836" cy="228" r="7" fill="#22D3EE"/><text x="854" y="228" font-size="18" fill="#E8ECF8" font-weight="600" text-anchor="start" dominant-baseline="middle">即时（每个动作）</text><text x="1010" y="229" font-size="15" fill="#93A0BF" font-weight="400" text-anchor="start" dominant-baseline="middle">对答案 / 引擎 / 导师批注</text><circle cx="836" cy="280" r="7" fill="#F59E0B"/><text x="854" y="280" font-size="18" fill="#E8ECF8" font-weight="600" text-anchor="start" dominant-baseline="middle">每日（日志复盘）</text><text x="1010" y="281" font-size="15" fill="#93A0BF" font-weight="400" text-anchor="start" dominant-baseline="middle">错题日志 + 根因分类</text><circle cx="836" cy="332" r="7" fill="#8B5CF6"/><text x="854" y="332" font-size="18" fill="#E8ECF8" font-weight="600" text-anchor="start" dominant-baseline="middle">每周（教练/检视）</text><text x="1020" y="333" font-size="15" fill="#93A0BF" font-weight="400" text-anchor="start" dominant-baseline="middle">周检视 + 高手示范 [C44]</text><text x="824" y="370" font-size="15" fill="#F59E0B" font-weight="400" text-anchor="start" dominant-baseline="middle">具体、可行动、对事不对人；约 1/3 的反馈会反噬 [C46][C47]</text><rect x="800" y="420" width="590" height="300" rx="18" fill="#121A2E" stroke="#232F4E" stroke-width="1.2"/><text x="824" y="452" font-size="22" fill="#E8ECF8" font-weight="700" text-anchor="start" dominant-baseline="middle">错误日志（示例结构）</text><rect x="818" y="472" width="554" height="36" rx="10" fill="#0E1526"/><text x="824" y="490" font-size="15" fill="#93A0BF" font-weight="600" text-anchor="start" dominant-baseline="middle">日期</text><text x="894" y="490" font-size="15" fill="#93A0BF" font-weight="600" text-anchor="start" dominant-baseline="middle">错因类型</text><text x="1014" y="490" font-size="15" fill="#93A0BF" font-weight="600" text-anchor="start" dominant-baseline="middle">修正动作</text><text x="1240" y="490" font-size="15" fill="#93A0BF" font-weight="600" text-anchor="start" dominant-baseline="middle">复测</text><text x="824" y="520" font-size="15" fill="#C7D2EA" font-weight="400" text-anchor="start" dominant-baseline="middle">10-01</text><text x="894" y="520" font-size="15" fill="#C7D2EA" font-weight="400" text-anchor="start" dominant-baseline="middle">概念错</text><text x="1014" y="520" font-size="15" fill="#C7D2EA" font-weight="400" text-anchor="start" dominant-baseline="middle">重学前置概念，画反例</text><text x="1240" y="520" font-size="15" fill="#C7D2EA" font-weight="400" text-anchor="start" dominant-baseline="middle">10-04 ✓</text><line x1="818" y1="546" x2="1372" y2="546" stroke="#2A3550" stroke-width="1"/><text x="824" y="566" font-size="15" fill="#C7D2EA" font-weight="400" text-anchor="start" dominant-baseline="middle">10-02</text><text x="894" y="566" font-size="15" fill="#C7D2EA" font-weight="400" text-anchor="start" dominant-baseline="middle">程序错</text><text x="1014" y="566" font-size="15" fill="#C7D2EA" font-weight="400" text-anchor="start" dominant-baseline="middle">慢速分解，重练 2 组</text><text x="1240" y="566" font-size="15" fill="#C7D2EA" font-weight="400" text-anchor="start" dominant-baseline="middle">10-05 重练</text><line x1="818" y1="592" x2="1372" y2="592" stroke="#2A3550" stroke-width="1"/><text x="824" y="612" font-size="15" fill="#C7D2EA" font-weight="400" text-anchor="start" dominant-baseline="middle">10-03</text><text x="894" y="612" font-size="15" fill="#C7D2EA" font-weight="400" text-anchor="start" dominant-baseline="middle">粗心</text><text x="1014" y="612" font-size="15" fill="#C7D2EA" font-weight="400" text-anchor="start" dominant-baseline="middle">检查清单 + 限时 3 题</text><text x="1240" y="612" font-size="15" fill="#C7D2EA" font-weight="400" text-anchor="start" dominant-baseline="middle">10-06 ✓</text><text x="824" y="678" font-size="15" fill="#93A0BF" font-weight="400" text-anchor="start" dominant-baseline="middle">根因分类：概念错｜程序错｜粗心｜记忆缺失 —— 不同根因，不同药方</text><text x="824" y="704" font-size="15" fill="#22D3EE" font-weight="400" text-anchor="start" dominant-baseline="middle">先自己提交版本，再请 AI 挑错（护栏用法）[C56]</text><text x="720" y="900" font-size="15" fill="#5E6C8F" font-weight="400" text-anchor="middle" dominant-baseline="middle">刻意练习 = 明确子目标 × 全神贯注 × 能力边缘 × 即时反馈与修正 [C31]</text></svg>