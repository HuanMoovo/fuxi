" y="220" font-size="15" fill="#8B5CF6" font-weight="600" text-anchor="start" dominant-baseline="middle">复习②</text><circle cx="366.7" cy="240.0" r="7" fill="#FB7185" stroke="#0B1020" stroke-width="3"/><text x="377" y="220" font-size="15" fill="#FB7185" font-weight="600" text-anchor="start" dominant-baseline="middle">复习③</text><text x="852" y="256" font-size="15" fill="#93A0BF" font-weight="400" text-anchor="end" dominant-baseline="middle">S 随复习增长 → 曲线越来越平</text><text x="120" y="772" font-size="15" fill="#93A0BF" font-weight="400" text-anchor="start" dominant-baseline="middle">口径：最佳间隔 ≈ 目标保持期的 10–20% [C06]；254 项实验支持分布练习 [C04]</text><rect x="940" y="240" width="560" height="268" rx="18" fill="#121A2E" stroke="#232F4E" stroke-width="1.2"/><text x="962" y="270" font-size="22" fill="#E8ECF8" font-weight="700" text-anchor="start" dominant-baseline="middle">交错练习 vs 块状练习</text><rect x="962" y="290" width="18" height="18" rx="4" fill="#34D399" opacity="0.9"/><text x="986" y="299" font-size="14" fill="#93A0BF" font-weight="400" text-anchor="start" dominant-baseline="middle">A 类题型</text><rect x="1028" y="290" width="18" height="18" rx="4" fill="#8B5CF6" opacity="0.9"/><text x="1052" y="299" font-size="14" fill="#93A0BF" font-weight="400" text-anchor="start" dominant-baseline="middle">B 类题型</text><rect x="1094" y="290" width="18" height="18" rx="4" fill="#F59E0B" opacity="0.9"/><text x="1118" y="299" font-size="14" fill="#93A0BF" font-weight="400" text-anchor="start" dominant-baseline="middle">C 类题型</text><text x="962" y="346" font-size="16" fill="#E8ECF8" font-weight="600" text-anchor="start" dominant-baseline="middle">块状</text><rect x="1036" y="324" width="44" height="44" rx="8" fill="#34D399" opacity="0.85"/><text x="1058" y="347" font-size="20" fill="#0B1020" font-weight="800" text-anchor="middle" dominant-baseline="middle">A</text><rect x="1084" y="324" width="44" height="44" rx="8" fill="#34D399" opacity="0.85"/><text x="1106" y="347" font-size="20" fill="#0B1020" font-weight="800" text-anchor="middle" dominant-baseline="middle">A</text><rect x="1132" y="324" width="44" height="44" rx="8" fill="#34D399" opacity="0.85"/><text x="1154" y="347" font-size="20" fill="#0B1020" font-weight="800" text-anchor="middle" dominant-baseline="middle">A</text><rect x="1180" y="324" width="44" height="44" rx="8" fill="#8B5CF6" opacity="0.85"/><text x="1202" y="347" font-size="20" fill="#0B1020" font-weight="800" text-anchor="middle" dominant-baseline="middle">B</text><rect x="1228" y="324" width="44" height="44" rx="8" fill="#8B5CF6" opacity="0.85"/><text x="1250" y="347" font-size="20" fill="#0B1020" font-weight="800" text-anchor="middle" dominant-baseline="middle">B</text><rect x="1276" y="324" width="44" height="44" rx="8" fill="#8B5CF6" opacity="0.85"/><text x="1298" y="347" font-size="20" fill="#0B1020" font-weight="800" text-anchor="middle" dominant-baseline="middle">B</text><rect x="1324" y="324" width="44" height="44" rx="8" fill="#F59E0B" opacity="0.85"/><text x="1346" y="347" font-size="20" fill="#0B1020" font-weight="800" text-anchor="middle" dominant-baseline="middle">C</text><rect x="1372" y="324" width="44" height="44" rx="8" fill="#F59E0B" opacity="0.85"/><text x="1394" y="347" font-size="20" fill="#0B1020" font-weight="800" text-anchor="middle" dominant-baseline="middle">C</text><rect x="1420" y="324" width="44" height="44" rx="8" fill="#F59E0B" opacity="0.85"/><text x="1442" y="347" font-size="20" fill="#0B1020" font-weight="800" text-anchor="middle" dominant-baseline="middle">C</text><text x="962" y="404" font-size="16" fill="#E8ECF8" font-weight="600" text-anchor="start" dominant-baseline="middle">交错</text><rect x="1036" y="382" width="44" height="44" rx="8" fill="#34D399" opacity="0.85"/><text x="1058" y="405" font-size="20" fill="#0B1020" font-weight="800" text-anchor="middle" dominant-baseline="middle">A</text><rect x="1084" y="382" width="44" height="44" rx="8" fill="#8B5CF6" opacity="0.85"/><text x="1106" y="405" font-size="20" fill="#0B1020" font-weight="800" text-anchor="middle" dominant-baseline="middle">B</text><rect x="1132" y="382" width="44" height="44" rx="8" fill="#F59E0B" opacity="0.85"/><text x="1154" y="405" font-size="20" fill="#0B1020" font-weight="800" text-anchor="middle" dominant-baseline="middle">C</text><rect x="1180" y="382" width="44" height="44" rx="8" fill="#34D399" opacity="0.85"/><text x="1202" y="405" font-size="20" fill="#0B1020" font-weight="800" text-anchor="middle" dominant-baseline="middle">A</text><rect x="1228" y="382" width="44" height="44" rx="8" fill="#8B5CF6" opacity="0.85"/><text x="1250" y="405" font-size="20" fill="#0B1020" font-weight="800" text-anchor="middle" dominant-baseline="middle">B</text><rect x="1276" y="382" width="44" height="44" rx="8" fill="#F59E0B" opacity="0.85"/><text x="1298" y="405" font-size="20" fill="#0B1020" font-weight="800" text-anchor="middle" dominant-baseline="middle">C</text><rect x="1324" y="382" width="44" height="44" rx="8" fill="#34D399" opacity="0.85"/><text x="1346" y="405" font-size="20" fill="#0B1020" font-weight="800" text-anchor="middle" dominant-baseline="middle">A</text><rect x="1372" y="382" width="44" height="44" rx="8" fill="#8B5CF6" opacity="0.85"/><text x="1394" y="405" font-size="20" fill="#0B1020" font-weight="800" text-anchor="middle" dominant-baseline="middle">B</text><rect x="1420" y="382" width="44" height="44" rx="8" fill="#F59E0B" opacity="0.85"/><text x="1442" y="405" font-size="20" fill="#0B1020" font-weight="800" text-anchor="middle" dominant-baseline="middle">C</text><text x="962" y="454" font-size="15" fill="#93A0BF" font-weight="400" text-anchor="start" dominant-baseline="middle">块状：一类连做，手感顺。 交错：混着练，学得慢、记得牢。</text><text x="962" y="484" font-size="15" fill="#F59E0B" font-weight="400" text-anchor="start" dominant-baseline="middle">延迟测验 61% vs 38%（d=0.83）；材料越相似收益越大 [C07][C08]</text><rect x="940" y="536" width="560" height="300" rx="18" fill="#121A2E" stroke="#232F4E" stroke-width="1.2"/><text x="962" y="568" font-size="22" fill="#E8ECF8" font-weight="700" text-anchor="start" dominant-baseline="middle">调度：SM-2 → FSRS</text><circle cx="976" cy="610" r="13" fill="#0E2433" stroke="#22D3EE" stroke-width="1.2"/><text x="976" y="611" font-size="13" fill="#22D3EE" font-weight="700" text-anchor="middle" dominant-baseline="middle">1</text><text x="1002" y="610" font-size="16" fill="#C7D2EA" font-weight="400" text-anchor="start" dominant-baseline="middle">每张卡有状态：难度 D · 稳定度 S · 可提取度 R</text><circle cx="976" cy="654" r="13" fill="#0E2433" stroke="#22D3EE" stroke-width="1.2"/><text x="976" y="655" font-size="13" fill="#22D3EE" font-weight="700" text-anchor="middle" dominant-baseline="middle">2</text><text x="1002" y="654" font-size="16" fill="#C7D2EA" font-weight="400" text-anchor="start" dominant-baseline="middle">你给评分（Again / Hard / Good / Easy）</text><circle cx="976" cy="698" r="13" fill="#0E2433" stroke="#22D3EE" stroke-width="1.2"/><text x="976" y="699" font-size="13" fill="#22D3EE" font-weight="700" text-anchor="middle" dominant-baseline="middle">3</text><text x="1002" y="698" font-size="16" fill="#C7D2EA" font-weight="400" text-anchor="start" dominant-baseline="middle">更新 D、S，计算下个复习间隔</text><circle cx="976" cy="742" r="13" fill="#0E2433" stroke="#22D3EE" stroke-width="1.2"/><text x="976" y="743" font-size="13" fill="#22D3EE" font-weight="700" text-anchor="middle" dominant-baseline="middle">4</text><text x="1002" y="742" font-size="16" fill="#C7D2EA" font-weight="400" text-anchor="start" dominant-baseline="middle">目标留存率（desired retention）由你设定，如 0.9</text><text x="962" y="798" font-size="15" fill="#22D3EE" font-weight="400" text-anchor="start" dominant-baseline="middle">2.2 亿学习日志建模，较当时最优方法 +12.6% [C26]</text><text x="962" y="822" font-size="15" fill="#93A0BF" font-weight="400" text-anchor="start" dominant-baseline="middle">墨墨背单词线上部署；FSRS 已内置 Anki [C26][C27]</text><text x="780" y="880" font-size="15" fill="#5E6C8F" font-weight="400" text-anchor="middle" dominant-baseline="middle">间隔 = 把时间变成盟友：复习点由算法安排，你只负责检索与评分</text></svg>