<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="900" viewBox="0 0 1560 900"><title>间隔：遗忘曲线与复习调度</title><defs><marker id="aN" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,1 L7,4.5 L0,8" fill="none" stroke="#93A0BF" stroke-width="1.6"/></marker><marker id="aE0" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,1 L7,4.5 L0,8" fill="none" stroke="#8B5CF6" stroke-width="1.8"/></marker><marker id="aE1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,1 L7,4.5 L0,8" fill="none" stroke="#22D3EE" stroke-width="1.8"/></marker><marker id="aE2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,1 L7,4.5 L0,8" fill="none" stroke="#34D399" stroke-width="1.8"/></marker><marker id="aE3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,1 L7,4.5 L0,8" fill="none" stroke="#F59E0B" stroke-width="1.8"/></marker><marker id="aE4" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,1 L7,4.5 L0,8" fill="none" stroke="#FB7185" stroke-width="1.8"/></marker><radialGradient id="glowV" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.22"/><stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient><radialGradient id="glowC" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#22D3EE" stop-opacity="0.18"/><stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/></radialGradient><linearGradient id="lgA" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8B5CF6"/><stop offset="25%" stop-color="#22D3EE"/><stop offset="50%" stop-color="#34D399"/><stop offset="75%" stop-color="#F59E0B"/><stop offset="100%" stop-color="#FB7185"/></linearGradient></defs><rect width="1560" height="900" fill="#0B1020"/><circle cx="240" cy="200" r="330" fill="url(#glowV)"/><text x="64" y="70" font-size="40" fill="#E8ECF8" font-weight="800" text-anchor="start" dominant-baseline="middle">间隔 · 在遗忘边缘复习</text><text x="64" y="110" font-size="19" fill="#93A0BF" font-weight="400" text-anchor="start" dominant-baseline="middle">遗忘不是 bug；卡在 R≈0.9 复习，收益/成本最优</text><text x="100" y="196" font-size="16" fill="#C7D2EA" font-weight="500" text-anchor="start" dominant-baseline="middle">R = e^(−t/S)　（S 越大，衰减越慢）</text><line x1="120" y1="700" x2="860" y2="700" stroke="#2A3550" stroke-width="1.5"/><line x1="120" y1="240" x2="120" y2="700" stroke="#2A3550" stroke-width="1.5"/><text x="490" y="742" font-size="17" fill="#93A0BF" font-weight="400" text-anchor="middle" dominant-baseline="middle">时间 →</text><text x="78" y="470" font-size="17" fill="#93A0BF" font-weight="400" text-anchor="middle" dominant-baseline="middle">记忆强度 R</text><text x="108" y="240" font-size="14" fill="#93A0BF" font-weight="400" text-anchor="end" dominant-baseline="middle">1.0</text><text x="108" y="470" font-size="14" fill="#93A0BF" font-weight="400" text-anchor="end" dominant-baseline="middle">0.5</text><text x="108" y="700" font-size="14" fill="#93A0BF" font-weight="400" text-anchor="end" dominant-baseline="middle">0</text><line x1="120" y1="286.0" x2="860" y2="286.0" stroke="#F59E0B" stroke-width="1.3" stroke-dasharray="6 6" opacity="0.75"/><text x="852" y="270" font-size="15" fill="#F59E0B" font-weight="600" text-anchor="end" dominant-baseline="middle">R ≈ 0.9：最佳复习窗口</text><polyline points="120.0,240.0 125.1,341.8 130.3,421.0 135.4,482.7 140.6,530.8" fill="none" stroke="#22D3EE" stroke-width="3" opacity="0.95"/><polyline points="140.6,240.0 145.7,276.8 150.8,310.6 156.0,341.8 161.1,370.4 166.2,396.7 171.4,421.0 176.5,443.3 181.7,463.8 186.8,482.7 191.9,500.1 197.1,516.1 202.2,530.8" fill="none" stroke="#34D399" stroke-width="3" opacity="0.95"/><polyline points="202.2,240.0 207.4,254.2 212.5,267.9 217.6,281.2 222.8,294.1 227.9,306.5 233.1,318.6 238.2,330.4 243.3,341.8 248.5,352.8 253.6,363.5 258.8,373.8 263.9,383.8 269.0,393.6 274.2,403.0 279.3,412.1 284.4,421.0 289.6,429.6 294.7,437.9