"41" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'Segoe Print','Bradley Hand','Comic Sans MS','KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" dominant-baseline="middle">为什么</text></g><rect x="61" y="240" width="830" height="460" rx="10" fill="#00000010"/><rect x="58" y="236" width="830" height="460" rx="10" fill="#FFFDF6" stroke="#D9CFB8" stroke-width="1.3"/><path d="M140 636 C320 624 480 596 590 510 C680 438 742 334 800 274" fill="none" stroke="#6E4E9E" stroke-width="3.4"/><path d="M140 560 L830 548" fill="none" stroke="#C97A3D" stroke-width="3"/><path d="M140 560 L830 548 L800 274 C742 334 680 438 590 510 C480 596 320 624 140 636 Z" fill="#F6E27A" opacity="0.35"/><path d="M140 636 L140 280 M140 636 L830 636" fill="none" stroke="#8A8F7A" stroke-width="2"/><text x="600" y="470" font-size="15" fill="#6E4E9E" font-weight="600" text-anchor="start" font-family="'Segoe Print','Bradley Hand','Comic Sans MS','KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" dominant-baseline="middle">科学文献累积（+4.1%/年 · 17.3 年翻番）[C203]</text><text x="150" y="542" font-size="15" fill="#C97A3D" font-weight="600" text-anchor="start" font-family="'Segoe Print','Bradley Hand','Comic Sans MS','KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" dominant-baseline="middle">个体学习带宽（近似恒定）</text><rect x="384" y="424" width="256" height="30" rx="4" fill="#F6E27A" opacity="0.6"/><text x="394" y="446" font-size="16" fill="#2B2F36" font-weight="700" text-anchor="start" font-family="'Segoe Print','Bradley Hand','Comic Sans MS','KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" dominant-baseline="middle">缺口 = 地图与标尺的价值</text><text x="700" y="664" font-size="13" fill="#8A8F7A" font-weight="400" text-anchor="start" font-family="'Segoe Print','Bradley Hand','Comic Sans MS','KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" dominant-baseline="middle">(示意) 1750 → 2026 · 纵轴对数示意</text><rect x="923" y="240" width="582" height="148" rx="10" fill="#00000010"/><rect x="920" y="236" width="582" height="148" rx="10" fill="#FFFDF6" stroke="#D9CFB8" stroke-width="1.3"/><rect x="-38.0" y="-11.0" width="76" height="22" fill="#E7DCF0" opacity="0.85" rx="3" transform="translate(980 236) rotate(-9)"/><text x="946" y="280" font-size="23" fill="#2B2F36" font-weight="700" text-anchor="start" font-family="'Segoe Print','Bradley Hand','Comic Sans MS','KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" dominant-baseline="middle">① 知识不对称</text><text x="946" y="318" font-size="14" fill="#454C59" font-weight="400" text-anchor="start" font-family="'Segoe Print','Bradley Hand','Comic Sans MS','KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" dominant-baseline="middle">年增 4.1%（17.3 年翻番）[C203] · 存储 +23%/年 [C204]</text><text x="946" y="350" font-size="15" fill="#B04A5A" font-weight="600" text-anchor="start" font-family="'Segoe Print','Bradley Hand','Comic Sans MS','KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" dominant-baseline="middle">→ 读完再上场，已不可行</text><rect x="923" y="402" width="582" height="148" rx="10" fill="#00000010"/><rect x="920" y="398" width="582" height="148" rx="10" fill="#FFFDF6" stroke="#D9CFB8" stroke-width="1.3"/><rect x="-38.0" y="-11.0" width="76" height="22" fill="#D9E7F2" opacity="0.85" rx="3" transform="translate(980 398) rotate(-9)"/><text x="946" y="442" font-size="23" fill="#2B2F36" font-weight="700" text-anchor="start" font-family="'Segoe Print','Bradley Hand','Comic Sans MS','KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" dominant-baseline="middle">② 教育滞后</text><text x="946" y="480" font-size="14" fill="#454C59" font-weight="400" text-anchor="start" font-family="'Segoe Print','Bradley Hand','Comic Sans MS','KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" dominant-baseline="middle">PISA 2022 历史性下跌 [C209] · 学习贫困 ~70% [C206] · 慕课完成 ~3% [C205]</text><text x="946" y="512" font-size="15" fill="#B04A5A" font-weight="600" text-anchor="start" font-family="'Segoe Print','Bradley Hand','Comic Sans MS','KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" dominant-baseline="middle">→ 开放 ≠ 完成，需要质量工具</text><rect x="923" y="564" width="582" height="148" rx="10" fill="#00000010"/><rect x="920" y="560" width="582" height="148" rx="10" fill="#FFFDF6" stroke="#D9CFB8" stroke-width="1.3"/><rect x="-38.0" y="-11.0" width="76" height="22" fill="#DCEBE0" opacity="0.85" rx="3" transform="translate(980 560) rotate(-9)"/><text x="946" y="604" font-size="23" fill="#2B2F36" font-weight="700" text-anchor="start" font-family="'Segoe Print','Bradley Hand','Comic Sans MS','KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" dominant-baseline="middle">③ AI 与注意力</text><text x="946" y="642" font-size="14" fill="#454C59" font-weight="400" text-anchor="start" font-family="'Segoe Print','Bradley Hand','Comic Sans MS','KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" dominant-baseline="middle">无护栏 AI：练时 +48% / 考时 −17% [C56] · 孤独列流行病级威胁 [C207][C208]</text><text x="946" y="674" font-size="15" fill="#B04A5A" font-weight="600" text-anchor="start" font-family="'Segoe Print','Bradley Hand','Comic Sans MS','KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" dominant-baseline="middle">→ 需要自带护栏的学习系统</text><rect x="61" y="726" width="1440" height="82" rx="10" fill="#00000010"/><rect x="58" y="722" width="1440" height="82" rx="10" fill="#FFFDF6" stroke="#D9CFB8" stroke-width="1.3"/><text x="96" y="756" font-size="19" fill="#454C59" font-weight="600" text-anchor="start" font-family="'Segoe Print','Bradley Hand','Comic Sans MS','KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" dominant-baseline="middle">答案（本框架）：十阶地图 · A/B/C/D 证据标尺 · 双路径走法 · 开源可纠错</text><text x="96" y="786" font-size="15" fill="#6B7280" font-weight="400" text-anchor="start" font-family="'Segoe Print','Bradley Hand','Comic Sans MS','KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" dominant-baseline="middle">十阶之后还有拓界：科研 · 创业 · 人际 · 长寿 · 未来 —— 以及第五个「为什么」：知识边界之后怎么办</text><text x="96" y="894" font-size="14" fill="#8A8F7A" font-weight="400" text-anchor="start" font-family="'Segoe Print','Bradley Hand','Comic Sans MS','KaiTi','STKaiti','Kaiti SC','Noto Serif SC',serif" dominant-baseline="middle">详见 docs/why.md · 文献 C203–C209 · 全部逐条核验</text></svg>