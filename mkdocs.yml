# 伏羲框架 · 书籍版（Material for MkDocs）
# 构建：python site/prepare.py && python -m mkdocs build --strict
site_name: 伏羲框架 · 万物皆可学
site_description: 十阶时间线 × 证据分级 × 开源工具链 —— 适合阅读的书籍版（Material · 天蓝）
site_url: https://HuanMoovo.github.io/fuxi/book/
docs_dir: site/build
site_dir: site/dist
use_directory_urls: true

theme:
  name: material
  language: zh
  logo: assets/fuxi-logo.svg
  favicon: assets/fuxi-mark.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: light blue
      accent: light blue
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: light blue
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy

plugins:
  - search:
      lang: zh

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 2-3
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde

extra_css:
  - styles/extra.css

copyright: 文档 CC BY 4.0 · 代码 MIT ｜ 在线主页：https://HuanMoovo.github.io/fuxi/

