name: Deploy Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", "site/**", "mkdocs.yml", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site/requirements.txt
      - name: Build book site (Material)
        run: |
          python -m pip install -r site/requirements.txt
          python site/prepare.py
          python -m mkdocs build --strict
      - name: Assemble deploy directory
        run: |
          mkdir -p _deploy/book
          cp -r docs/. _deploy/
          cp -r site/dist/. _deploy/book/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _deploy
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
